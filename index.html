<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Live Stream</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #181825;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: #1e1e2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #313244;
            position: relative;
        }
        h1 { margin-top: 15px; color: #a6e3a1; font-size: 24px; }
        .room-badge {
            background: #313244;
            color: #f5c2e7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        button.main-btn {
            background: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }
        button.main-btn:hover { background: #94e2d5; }
        button.main-btn:active { transform: scale(0.98); }
        
        .status {
            font-size: 15px;
            color: #bac2de;
            margin: 20px 0;
            min-height: 22px;
        }
        .video-box {
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            margin-top: 15px;
            display: none;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Панель эмоций */
        .reactions-panel {
            display: none;
            justify-content: space-around;
            margin-top: 20px;
            background: #11111b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #313244;
        }
        .reaction-btn {
            background: #313244;
            border: none;
            font-size: 22px;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .reaction-btn:hover { background: #45475a; transform: scale(1.15); }
        .reaction-btn:active { transform: scale(0.9); }

        /* Плавающие эмоции на экране */
        .floating-emoji {
            position: fixed;
            bottom: 20px;
            font-size: 32px;
            animation: floatUp 3s ease-out forwards;
            pointer-events: none;
            z-index: 99999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-350px) scale(1); opacity: 0; }
        }

        .audio-overlay {
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 27, 0.95); backdrop-filter: blur(8px);
            z-index: 9999; justify-content: center; align-items: center;
        }
        .audio-modal {
            background: #313244; padding: 30px; border-radius: 12px;
            border: 2px solid #f5c2e7; text-align: center; max-width: 340px; width: 100%;
        }
        .audio-modal p { margin: 0 0 20px 0; font-size: 16px; color: #cdd6f4; line-height: 1.4; }
        .audio-modal input.name-input {
            width: 90%; padding: 10px; border-radius: 6px; border: 1px solid #45475a;
            background: #1e1e2e; color: #cdd6f4; margin-bottom: 15px; text-align: center; font-size: 16px;
        }
        .audio-modal button {
            background: #f5c2e7; color: #11111b; border: none;
            padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay" class="audio-overlay">
    <div class="audio-modal">
        <h2 style="color: #a6e3a1; margin-top: 0;">ASMR Stream</h2>
        <p>Введите ваше имя и нажмите кнопку для подключения к прямому эфиру:</p>
        <input type="text" id="usernameInput" class="name-input" maxlength="20" placeholder="Ваше имя...">
        <button id="startListenBtn">Слушать эфир</button>
    </div>
</div>

<div class="card">
    <h1 id="txt-title">ASMR Live Stream</h1>
    <div class="room-badge">Прямой эфир</div>
    
    <div id="controlsHost" style="display: none;">
        <button id="broadcastBtn" class="main-btn">Запустить трансляцию</button>
    </div>
    
    <div class="status" id="statusText">Ожидание подключения...</div>

    <div class="video-box" id="videoBox">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <!-- Панель с 6 кнопками эмоций -->
    <div id="reactionsPanel" class="reactions-panel">
        <button class="reaction-btn" onclick="sendReaction('❤️')">❤️</button>
        <button class="reaction-btn" onclick="sendReaction('🔥')">🔥</button>
        <button class="reaction-btn" onclick="sendReaction('👏')">👏</button>
        <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
        <button class="reaction-btn" onclick="sendReaction('😮')">😮</button>
        <button class="reaction-btn" onclick="sendReaction('😴')">😴</button>
    </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
