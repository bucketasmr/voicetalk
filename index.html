<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Video & Audio Room</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #181825;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e2e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #313244;
            position: relative;
        }
        .lang-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .lang-btn {
            background: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 2px;
            font-weight: bold;
        }
        .lang-btn.active {
            background: #f5c2e7;
            color: #11111b;
            border-color: #f5c2e7;
        }
        h1 { margin-top: 15px; color: #a6e3a1; font-size: 22px; }
        .room-badge {
            background: #313244;
            color: #f5c2e7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .video-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        video {
            width: 48%;
            background: #11111b;
            border-radius: 8px;
            border: 1px solid #45475a;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркало для веб-камеры */
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button.main-btn {
            background: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            transition: transform 0.1s, background 0.2s;
        }
        button.main-btn:hover { background: #94e2d5; }
        button.main-btn:active { transform: scale(0.98); }
        button.main-btn:disabled { background: #585b70; color: #a6adc8; cursor: not-allowed; }
        
        button.control-btn {
            background: #313244;
            color: #f5e0dc;
            border: 1px solid #45475a;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none; /* Скрыта до подключения */
        }
        button.control-btn.muted {
            background: #f38ba8;
            color: #11111b;
        }
        .status {
            font-size: 14px;
            color: #bac2de;
            margin: 10px 0;
            min-height: 20px;
        }
        .log-container {
            margin-top: 10px;
            text-align: right;
        }
        .copy-btn {
            background: #313244;
            color: #f5e0dc;
            border: 1px solid #45475a;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
        }
        #log {
            background: #11111b;
            padding: 10px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            font-size: 11px;
            text-align: left;
            color: #f5e0dc;
            font-family: monospace;
            border: 1px solid #313244;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="lang-switcher">
        <button class="lang-btn" id="btn-en" onclick="changeLanguage('en')">EN</button>
        <button class="lang-btn" id="btn-uk" onclick="changeLanguage('uk')">UK</button>
        <button class="lang-btn" id="btn-ru" onclick="changeLanguage('ru')">RU</button>
    </div>

    <h1 id="txt-title">Global Video Chat</h1>
    <div class="room-badge" id="txt-badge">Room: World Wide</div>
    
    <!-- Видеопотоки: Свой и Собеседника -->
    <div class="video-grid">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="joinBtn" class="main-btn">Join Room</button>
        <button id="micBtn" class="control-btn">🎤 Mute</button>
    </div>
    
    <div class="status" id="statusText">Click button to connect...</div>
    
    <div class="log-container">
        <button id="copyLogBtn" class="copy-btn">Copy Logs</button>
        <div id="log">System ready. Click 'Join Room'.</div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>

</body>
</html>
