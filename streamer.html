<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Стримера - Аудио Поток</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-550px) scale(1); opacity: 0; }
        }
        .floating-reaction {
            position: fixed;
            bottom: 20px;
            animation: floatUp 3s linear forwards;
            pointer-events: none;
            z-index: 9999;
            font-size: 2.5rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- Контейнер для всплывающих реакций -->
    <div id="reactionsContainer" class="fixed inset-0 pointer-events-none z-50"></div>

    <div class="max-w-md w-full bg-gray-800 rounded-xl p-6 shadow-2xl border border-gray-700 z-10">
        <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">Панель Стримера</h1>
        <p id="activeServerLabel" class="text-center text-xs text-gray-400 mb-4">Комната не запущена</p>
        
        <div id="status" class="mb-4 p-3 bg-red-900/50 border border-red-500 rounded text-center text-sm">
            Статус: Оффлайн
        </div>

        <button id="startBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-3 rounded-lg transition mb-3">
            Запустить трансляцию
        </button>

        <!-- Кнопка мьюта микрофона (скрыта до запуска) -->
        <button id="micToggleBtn" class="w-full bg-gray-700 hover:bg-gray-600 font-semibold py-2.5 rounded-lg transition mb-4 hidden text-sm">
            🎤 Микрофон: Включен
        </button>

        <!-- Панель реакций для стримера -->
        <div class="mb-4 pt-2 border-t border-gray-700">
            <p class="text-xs text-gray-400 mb-2">Отправить реакцию (видна всем):</p>
            <div class="flex justify-center gap-2">
                <button onclick="sendReaction('💤')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">💤</button>
                <button onclick="sendReaction('✨')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">✨</button>
                <button onclick="sendReaction('💜')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">💜</button>
                <button onclick="sendReaction('🌙')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">🌙</button>
                <button onclick="sendReaction('🫧')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">🫧</button>
                <button onclick="sendReaction('🐜')" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl text-xl transition transform hover:scale-110">🐜</button>
            </div>
        </div>

        <!-- Чат стрима -->
        <div class="border-t border-gray-700 pt-4 mb-4">
            <h2 class="text-lg font-semibold mb-2">Чат трансляции:</h2>
            <div id="chatMessages" class="bg-gray-900/60 border border-gray-700 rounded-lg p-3 h-36 overflow-y-auto flex flex-col gap-2 mb-2 text-sm">
                <p class="text-gray-500 text-xs italic text-center">Чат пуст...</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Сообщение чата..." class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none" disabled>
                <button id="sendChatBtn" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-semibold transition disabled:opacity-50" disabled>Отправить</button>
            </div>
        </div>

        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-lg font-semibold mb-2">Запросы от гостей:</h2>
            <div id="requestsList" class="space-y-3 max-h-40 overflow-y-auto mb-4">
                <p class="text-gray-400 text-sm italic" id="noRequests">Нет запросов</p>
            </div>

            <!-- Список активных слушателей -->
            <h2 class="text-lg font-semibold mb-2 border-t border-gray-700 pt-3">Слушают эфир сейчас:</h2>
            <div id="listenersList" class="space-y-2 max-h-40 overflow-y-auto">
                <p class="text-gray-400 text-sm italic" id="noListeners">Никого нет в эфире</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsUxU99lIftxAtWjjzSoCQ8MnqaHsBp_A",
            authDomain: "live-52b7d.firebaseapp.com",
            databaseURL: "https://live-52b7d-default-rtdb.firebaseio.com",
            projectId: "live-52b7d",
            storageBucket: "live-52b7d.firebasestorage.app",
            messagingSenderId: "640950676167",
            appId: "1:640950676167:web:51ffa9884adbbb32c4ace2",
            measurementId: "G-8V3GYSJKTV"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let peer = null;
        let localStream = null;
        const STREAMER_ROOM_ID = "streamer-" + Math.floor(1000 + Math.random() * 9000);
        let clientConnections = {};
        let isMicMuted = false;

        const startBtn = document.getElementById('startBtn');
        const micToggleBtn = document.getElementById('micToggleBtn');
        const statusDiv = document.getElementById('status');
        const activeServerLabel = document.getElementById('activeServerLabel');
        const requestsList = document.getElementById('requestsList');
        const listenersList = document.getElementById('listenersList');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        startBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 },
                    video: false
                });

                startBtn.disabled = true;
                startBtn.classList.add('opacity-50');
                micToggleBtn.classList.remove('hidden');
                chatInput.disabled = false;
                sendChatBtn.disabled = false;

                peer = new Peer(STREAMER_ROOM_ID, {
                    config: { 
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' },
                            { urls: 'stun:stun.cloudflare.com:3478' }
                        ] 
                    }
                });

                peer.on('open', (id) => {
                    statusDiv.textContent = 'Статус: Онлайн (Эфир активен)';
                    statusDiv.className = 'mb-4 p-3 bg-green-900/50 border border-green-500 rounded text-center text-sm';
                    activeServerLabel.innerHTML = `ID стримера: <b class="text-indigo-300">${id}</b>`;

                    db.ref('activeStream/roomId').set(id);
                    db.ref('activeStream/roomId').onDisconnect().remove();
                    db.ref('activeStream/listeners').onDisconnect().remove();
                    db.ref('activeStream/chat').onDisconnect().remove();

                    db.ref('activeStream/reactions').remove();
                    db.ref('activeStream/listeners').remove();
                    db.ref('activeStream/chat').remove();
                    
                    listenReactions();
                    listenListeners();
                    listenChat();
                });

                window.addEventListener('beforeunload', () => {
                    db.ref('activeStream/roomId').remove();
                    db.ref('activeStream/listeners').remove();
                    db.ref('activeStream/chat').remove();
                });

                peer.on('connection', (conn) => {
                    clientConnections[conn.peer] = conn;

                    conn.on('data', (data) => {
                        if (data.type === 'request-access') {
                            addRequestCard(conn.peer);
                        }
                    });

                    conn.on('close', () => {
                        document.getElementById(`req-${conn.peer}`)?.remove();
                        const safeKey = conn.peer.replace(/[.#$\/\[\]]/g, '_');
                        db.ref('activeStream/listeners/' + safeKey).remove();
                        delete clientConnections[conn.peer];
                        checkEmptyRequests();
                    });
                });

            } catch (err) {
                alert('Ошибка микрофона: ' + err.message);
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50');
            }
        });

        micToggleBtn.addEventListener('click', () => {
            if (!localStream) return;
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMicMuted;
            });

            if (isMicMuted) {
                micToggleBtn.textContent = '🔇 Микрофон: Выключен';
                micToggleBtn.className = 'w-full bg-red-700/80 hover:bg-red-700 font-semibold py-2.5 rounded-lg transition mb-4 text-sm';
            } else {
                micToggleBtn.textContent = '🎤 Микрофон: Включен';
                micToggleBtn.className = 'w-full bg-gray-700 hover:bg-gray-600 font-semibold py-2.5 rounded-lg transition mb-4 text-sm';
            }
        });

        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            db.ref('activeStream/chat').push({
                sender: 'Стример',
                isStreamer: true,
                text: text,
                timestamp: Date.now()
            });
            chatInput.value = '';
        }

        sendChatBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function listenChat() {
            db.ref('activeStream/chat').on('value', (snapshot) => {
                chatMessages.innerHTML = '';
                const messages = snapshot.val();

                if (!messages) {
                    chatMessages.innerHTML = '<p class="text-gray-500 text-xs italic text-center">Чат пуст...</p>';
                    return;
                }

                Object.values(messages).forEach(msg => {
                    const div = document.createElement('div');
                    div.className = msg.isStreamer ? 'text-indigo-400 font-semibold' : 'text-gray-200';
                    div.innerHTML = `<span class="text-xs text-gray-400">${msg.sender}:</span> ${escapeHtml(msg.text)}`;
                    chatMessages.appendChild(div);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        window.sendReaction = function(emoji) {
            db.ref('activeStream/reactions').push({
                emoji: emoji,
                timestamp: Date.now()
            });
        };

        function listenReactions() {
            const reactionsRef = db.ref('activeStream/reactions');
            reactionsRef.limitToLast(1).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.emoji) {
                    if (Date.now() - data.timestamp < 4000) {
                        showFloatingReaction(data.emoji);
                    }
                }
            });
        }

        function listenListeners() {
            db.ref('activeStream/listeners').on('value', (snapshot) => {
                listenersList.innerHTML = '';
                const listeners = snapshot.val();

                if (!listeners || Object.keys(listeners).length === 0) {
                    listenersList.innerHTML = '<p class="text-gray-400 text-sm italic" id="noListeners">Никого нет в эфире</p>';
                    return;
                }

                Object.keys(listeners).forEach(key => {
                    const listener = listeners[key];
                    const div = document.createElement('div');
                    div.id = `listener-${key}`;
                    div.className = 'bg-gray-700 p-2.5 rounded text-sm flex items-center justify-between';
                    div.innerHTML = `
                        <span class="text-xs text-gray-300 truncate max-w-[160px]">Слушатель: ${listener.peerId.substring(0, 8)}...</span>
                        <button onclick="kickListener('${key}', '${listener.peerId}')" class="bg-red-600 hover:bg-red-500 px-2.5 py-1 rounded text-xs font-semibold">Отключить</button>
                    `;
                    listenersList.appendChild(div);
                });
            });
        }

        window.kickListener = function(firebaseKey, peerId) {
            db.ref('activeStream/listeners/' + firebaseKey).remove();
            if (clientConnections[peerId]) {
                clientConnections[peerId].send({ type: 'kick' });
                clientConnections[peerId].close();
                delete clientConnections[peerId];
            }
        };

        function showFloatingReaction(emoji) {
            const container = document.getElementById('reactionsContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'floating-rotation floating-reaction';
            el.textContent = emoji;
            
            const randomX = Math.floor(Math.random() * 80) + 10;
            el.style.left = randomX + '%';

            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 3000);
        }

        function addRequestCard(guestId) {
            document.getElementById('noRequests')?.remove();
            if (document.getElementById(`req-${guestId}`)) return;

            const div = document.createElement('div');
            div.id = `req-${guestId}`;
            div.className = 'bg-gray-700 p-3 rounded text-sm flex items-center justify-between';
            div.innerHTML = `
                <span class="text-xs text-gray-300 truncate max-w-[150px]">Гость: ${guestId.substring(0, 8)}...</span>
                <button onclick="approveGuest('${guestId}')" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded text-xs font-semibold">Разрешить</button>
            `;
            requestsList.appendChild(div);
        }

        window.approveGuest = function(guestId) {
            document.getElementById(`req-${guestId}`)?.remove();
            checkEmptyRequests();

            if (peer && localStream) {
                peer.call(guestId, localStream);
                const conn = clientConnections[guestId];
                if (conn) {
                    conn.send({ type: 'grant-access' });
                }
            }
        };

        function checkEmptyRequests() {
            if (requestsList.children.length === 0) {
                requestsList.innerHTML = '<p class="text-gray-400 text-sm italic" id="noRequests">Нет запросов</p>';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
